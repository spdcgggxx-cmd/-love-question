<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເປັນແຟນກັນບໍ ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  background: linear-gradient(135deg,#ffb6d9,#ffc4c4,#d9b8ff);
  text-align: center;
  color: #b51f65;
}
.card {
  background: white;
  margin: 20px;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 8px 30px #a33a6640;
}
h1 { font-size: 27px; }
p { color: #777; }
button {
  border: none;
  border-radius: 30px;
  padding: 14px 24px;
  margin: 8px;
  font-size: 18px;
  cursor: pointer;
}
.yes { background: #ff4f91; color: white; }
.no { background: #eee; color: #555; }
#result { font-size: 22px; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:65px">💗</div>
  <h1>ເປັນແຟນກັນບໍ? 🥺</h1>
  <p>ມີບາງຄຳຢາກບອກເຈົ້າ...</p>
  <button class="yes" onclick="document.getElementById('result').innerHTML='ເຢ້! ❤️ ຂອບໃຈທີ່ໃຫ້ໂອກາດກັນ 💐😘'">ຕົກລົງ 💕</button>
  <button class="no" onclick="document.getElementById('result').innerHTML='ບໍ່ເປັນຫຍັງ 🥹 ຂອບໃຈທີ່ບອກກັນ ❤️'">ຂໍຄິດກ່ອນ 😊</button>
  <div id="result"></div>
</div>
</body>
</html>
